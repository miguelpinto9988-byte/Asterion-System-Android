name: Asterion — APK de prueba del registro

on:
  push:
    branches:
      - design/profile-wizard-components-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    name: Compilar APK debug de perfil (sin publicación)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verificar recursos finales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          folder = Path('app/src/main/res/drawable-nodpi')
          assets = list(folder.glob('*.webp'))
          assert len(assets) >= 94, f'Hay solo {len(assets)} WebP'
          for name in ('asterion_hunter_blue','asterion_hunter_gold',
                       'asterion_hunter_dark','asterion_hunter_white',
                       'asterion_header_light','asterion_header_dark',
                       'asterion_card_temple','asterion_companion_igris'):
              assert (folder / (name+'.webp')).is_file(), name
          assert not list(folder.glob('asterion_frame_*.webp'))
          assert not list(folder.glob('*ic_marco*.webp'))
          print(f'OK: {len(assets)} WebP en Android, sin marcos')
          PY
      - name: Preparar todos los GIF de ejercicios
        run: python3 tools/prepare_android_exercise_assets.py
      - name: Compilar APK debug instalable
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Comprobar firma de desarrollo
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: asterion-registro-perfil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
