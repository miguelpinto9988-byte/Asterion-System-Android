name: Registro nativo blanco-negro — validar APK principal
on:
  push:
    branches:
      - feature/profile-main-white-black-week-colors
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar recursos y contrato del registro
        run: |
          set -euo pipefail
          python3 tests/global_bold_contract.py
          python3 tests/branding_icon_lock.py
          python3 tests/branding_splash_lock.py
          python3 tests/profile_gate_contract.py
          python3 tests/profile_registration_step1_contract.py
          python3 tests/canva_profile_step1_contract.py
          python3 tests/canva_profile_step2_contract.py
          python3 tests/profile_wizard_visual_contract.py
          python3 tests/profile_monochrome_week_colors_contract.py
          python3 tests/phase16_preflight_static.py
          python3 tests/phase03_visual_source_contract.py
      - name: Compilar APK principal de depuración
        run: gradle --no-daemon :core:test :progress-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verificar paquete Android principal
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='pe.asterionsystem.app'"
          python3 tests/no_svg_artifact_contract.py --apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: asterion-main-package-monochrome-review
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
