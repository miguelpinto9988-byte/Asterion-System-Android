name: Asterion Android — debug CI

# Aprobación del propietario: compilar y validar APK debug automáticamente
# al publicar cambios en main. La ejecución manual también queda disponible.
# No generar release, no configurar firma de distribución.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validar y compilar Android Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar plataforma Android y herramientas
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "No se encontró sdkmanager"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          # La imagen de GitHub ya proporciona Android SDK. La acción setup-android@v3
          # intentaba instalar el paquete obsoleto 'tools'; por eso se omite.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Verificar recursos XML y contratos de fase 03/16 sin compilar
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/branding_icon_lock.py
          python3 tests/no_svg_artifact_contract.py
          python3 tests/global_bold_contract.py
          python3 tests/branding_splash_lock.py
          python3 tests/splash_window_insets_regression.py
          python3 tests/profile_gate_contract.py
          python3 tests/profile_registration_step1_contract.py
          python3 tests/canva_profile_step1_contract.py
          python3 tests/profile_wizard_visual_contract.py
          python3 tests/phase16_preflight_static.py
          python3 tests/phase03_visual_source_contract.py

      - name: Ejecutar pruebas de core, pruebas debug, lint y ensamblado debug
        run: gradle --no-daemon --stacktrace --continue :core:test :progress-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verificar APK firmada de desarrollo
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='pe.asterionsystem.app' versionCode='1' versionName='0.1.0'"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Confirmar que la APK no contiene archivos SVG
        run: python3 tests/no_svg_artifact_contract.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK de depuración como artefacto CI
        uses: actions/upload-artifact@v4
        with:
          name: asterion-fase16-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # The ordinary debug APK may have a new ephemeral signing certificate
      # for each CI run. Build a side-by-side variant instead of requiring
      # the user to uninstall Asterion and lose their local profile.
      - name: Compilar APK de prueba instalable sin reemplazar la anterior
        run: gradle --no-daemon --stacktrace :app:assemblePreview

      - name: Verificar identidad y firma de la APK de prueba
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='pe.asterionsystem.app.preview' versionCode='1' versionName='0.1.0-preview'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Confirmar que la APK de prueba tampoco contiene SVG
        run: python3 tests/no_svg_artifact_contract.py --apk app/build/outputs/apk/preview/app-preview.apk

      - name: Publicar APK de prueba independiente como artefacto CI
        uses: actions/upload-artifact@v4
        with:
          name: asterion-preview-instalable-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Probar arranque real en emulador Android 16
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar APK que se entrega al usuario
        uses: actions/download-artifact@v4
        with:
          name: asterion-preview-instalable-apk
          path: build/smoke

      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar APK y ejecutar el flujo inicial real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/android_runtime_smoke.sh

      - name: Publicar diagnóstico de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterion-runtime-diagnostics
          path: build/runtime-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
