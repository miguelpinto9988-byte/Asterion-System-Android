name: Asterion Android — debug CI

# Verificación debug para main y pull requests sin fusionar automáticamente.
# No generar release ni configurar firma de distribución.
on:
  push:
    branches:
      - main
      # Stacked feature PR is based on the catalog PR, not yet on main.
      - feature/rutinas-calendario-aleatoriedad-20261111
      - feature/avatar-2d-nativo-android-20261111
      - feature/avatar-controles-estables-20261111
      - feature/avatar-silueta-organica-20261111
      - feature/avatar-opcion-d-rig-render-20261111
      - feature/avatar-v3-detalle-por-piezas-20261111
      - feature/avatar-v4-rig-constraints-20261111
      - feature/avatar-v5-perfil-anatomia-recorrido-completo-20261111
      - feature/avatar-v6-multivista-manos-20261111
  pull_request:
    branches:
      - main
      - feature/catalogo-taxonomia-categorias-v2-20261110
      - feature/rutinas-calendario-aleatoriedad-20261111
      - consolidacion/asterion-integracion-20261111
      - feature/avatar-controles-estables-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validar y compilar Android Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar plataforma Android y herramientas
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "No se encontró sdkmanager"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          # La imagen de GitHub ya proporciona Android SDK. La acción setup-android@v3
          # intentaba instalar el paquete obsoleto 'tools'; por eso se omite.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Verificar recursos XML y contratos de fase 03/16 sin compilar
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/branding_icon_lock.py
          python3 tests/no_svg_artifact_contract.py
          python3 tests/global_bold_contract.py
          python3 tests/branding_splash_lock.py
          python3 tests/splash_window_insets_regression.py
          python3 tests/profile_gate_contract.py
          python3 tests/profile_registration_step1_contract.py
          python3 tests/canva_profile_step1_contract.py
          python3 tests/canva_profile_step2_contract.py
          python3 tests/profile_wizard_visual_contract.py
          python3 tests/profile_monochrome_week_colors_contract.py
          python3 tests/missions_from_catalog_contract.py
          python3 tests/monarch_randomness_contract.py
          python3 tests/routines_calendar_contract.py
          python3 tests/home_navigation_architecture_contract.py
          python3 tests/native_avatar_2d_contract.py
          python3 tests/native_avatar_organic_contract.py
          python3 tests/avatar_option_d_contract.py
          python3 tests/avatar_v3_visual_contract.py
          python3 tests/avatar_v4_motion_contract.py
          python3 tests/avatar_v5_anatomy_contract.py
          python3 tests/avatar_v6_multiview_contract.py
          python3 tests/android_runtime_crash_scope_contract.py
          python3 tests/mission_tracking_progress_contract.py
          python3 tests/autonomous_category_planner_contract.py
          python3 tests/weekly_category_review_contract.py
          python3 tests/routine_step_safety_contract.py
          python3 tests/exercise_five_category_expansion_contract.py
          python3 tests/exercise_intensity_catalog_contract.py
          python3 tests/exercise_category_hierarchy_contract.py
          python3 tests/multisport_catalog_contract.py
          python3 tests/catalog_consolidation_20261111.py
          python3 tests/exercise_category_hierarchy_contract.py
          python3 tests/multisport_catalog_contract.py
          python3 tests/daily_mission_stability_contract.py
          python3 tests/mission_diversity_contract.py
          python3 tests/mission_level_mix_contract.py
          python3 tests/consolidation_baseline_contract.py
          python3 tests/phase16_preflight_static.py
          python3 tests/phase03_visual_source_contract.py

      - name: Ejecutar pruebas de core, pruebas debug, lint y ensamblado debug
        run: gradle --no-daemon --stacktrace --continue :core:test :progress-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verificar APK firmada de desarrollo
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='pe.asterionsystem.app' versionCode='1' versionName='0.1.0'"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Confirmar que la APK no contiene archivos SVG
        run: python3 tests/no_svg_artifact_contract.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK del paquete principal como artefacto CI
        uses: actions/upload-artifact@v4
        with:
          name: asterion-fase16-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar APK instrumental para comprobar persistencia
        uses: actions/upload-artifact@v4
        with:
          name: asterion-daily-instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Probar arranque real en emulador Android 16
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar APK principal compilada
        uses: actions/download-artifact@v4
        with:
          name: asterion-fase16-debug-apk
          path: build/smoke

      - name: Descargar pruebas instrumentadas compiladas
        uses: actions/download-artifact@v4
        with:
          name: asterion-daily-instrumentation-apk
          path: build/smoke

      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar APK y ejecutar el flujo inicial real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash ci/android_runtime_smoke.sh
            bash ci/android_daily_instrumented_smoke.sh

      - name: Publicar diagnóstico de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterion-runtime-diagnostics
          path: build/runtime-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
