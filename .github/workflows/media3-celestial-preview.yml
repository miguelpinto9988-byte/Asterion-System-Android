name: Asterion Media3 — APK de prueba celestial

# Se ejecuta únicamente en la rama de revisión. No publica ni fusiona main.
on:
  push:
    branches:
      - feature/celestial-gif-preview-splash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Compilar APK preview con MP4 Full HD y Media3
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Herramientas multimedia y Pillow aislado
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'Pillow==12.0.0'

      - name: Generar MP4 H.264 local desde WebP Full HD versionado
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/prepare_splash_video.py
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -show_entries format=duration -of default=noprint_wrappers=1 app/src/main/res/raw/asterion_splash_celestial.mp4

      - name: Comprobar contratos existentes y nueva integración
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/branding_icon_lock.py
          python3 tests/branding_splash_lock.py
          python3 tests/splash_window_insets_regression.py
          python3 tests/splash_media3_contract.py
          python3 tests/splash_single_screen_contract.py
          python3 tests/splash_fullbleed_contract.py
          python3 tests/no_svg_artifact_contract.py
          python3 tests/phase16_preflight_static.py
          python3 tests/phase03_visual_source_contract.py
          python3 tests/profile_gate_contract.py
          python3 tests/profile_registration_step1_contract.py

      - name: Pruebas, lint y compilación de APK preview
        run: gradle --no-daemon --stacktrace :core:test :progress-engine:test :app:testDebugUnitTest :app:lintPreview :app:assemblePreview

      - name: Verificar paquete de prueba, firma y MP4 empacado
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='pe.asterionsystem.app.preview'"
          unzip -l "$APK" | grep 'res/raw/asterion_splash_celestial.mp4'
          python3 tests/no_svg_artifact_contract.py --apk "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK Media3 de prueba
        uses: actions/upload-artifact@v4
        with:
          name: asterion-media3-celestial-preview-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14

  emulator-preview:
    name: Probar arranque en emulador Android 16
    runs-on: ubuntu-24.04
    needs: build-preview
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asterion-media3-celestial-preview-apk
          path: build/smoke
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar Asterion en Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/android_runtime_smoke.sh
      - name: Subir diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterion-media3-runtime-diagnostics
          path: build/runtime-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
