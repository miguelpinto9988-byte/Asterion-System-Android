name: Importar fondos Canva Paso 2 (una sola vez)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-asterion-canva-paso2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descargar exactamente las dos vistas aprobadas
        env:
          MISIONES_URL: "https://media.canva.com/v2/document-image/hash:741658974/height:596/id:DAHaMe4I2zU/type:B/width:335?brand=BAEgD3O2qLQ&csig=AAAAAAAAAAAAAAAAAAAAACq5zfO7dKmnEr4K0D1eZjg0OV-zwaLKbL_k12exQ-gm&exp=1794021463&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2F4I2zU%2FDAHaMe4I2zU%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH545XFSWX%252F20261106%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261106T171131Z%26X-Amz-Expires%3D34689%26X-Amz-Signature%3Df8044312b507e813917d6050d373c6d9fa0e35685a9d769ba07b251d411462ef%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSat%252C%252007%2520Nov%25202026%252002%253A49%253A40%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAACTzgl7yeOIW6ywY_gA5Pk2BenCEaBbVWKoZA6lxoVyn&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
          RUTINAS_URL: "https://media.canva.com/v2/document-image/hash:1041760257/height:596/id:DAHaMe4I2zU/type:B/width:335?brand=BAEgD3O2qLQ&csig=AAAAAAAAAAAAAAAAAAAAAKEW9cfJvPyhPlA3Ym61eTbvnxYqkvhBsMERx9plBMoQ&exp=1794021463&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2F4I2zU%2FDAHaMe4I2zU%2F1%2Fthumbnail%2F0002.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH545XFSWX%252F20261106%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261106T024014Z%26X-Amz-Expires%3D86854%26X-Amz-Signature%3De77e957d234bcb4bd3d11792b084c1fdfa1187cf616f425c3d320de32f15341d%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSat%252C%252007%2520Nov%25202026%252002%253A47%253A48%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAC6xSBOkf1Ww20glSbx6sKUWw2JvmIIyp4U-us1laNCl&page=2&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          set -euo pipefail
          target='app/src/main/res/drawable-nodpi'
          mkdir -p "$target"
          curl --fail --location --retry 3 --silent --show-error "$MISIONES_URL" --output "$target/asterion_canva_paso2_misiones.png"
          curl --fail --location --retry 3 --silent --show-error "$RUTINAS_URL" --output "$target/asterion_canva_paso2_rutinas.png"
          python3 - <<'PY'
          from pathlib import Path
          for file in Path("app/src/main/res/drawable-nodpi").glob("asterion_canva_paso2_*.png"):
              data=file.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n',f"Invalid PNG: {file}"
              assert len(data)>10000,f"PNG too small: {file}"
              print(file, len(data))
          PY
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add "$target/asterion_canva_paso2_misiones.png" "$target/asterion_canva_paso2_rutinas.png"
          if ! git diff --cached --quiet; then
            git commit -m 'assets: incorporar las dos vistas Canva aprobadas del paso 2'
            git push
          fi
