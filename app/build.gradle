plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.asterionsystem.app'
    compileSdk 36

    defaultConfig {
        applicationId 'pe.asterionsystem.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // A single versioned source of exercise taxonomy for JVM tests and Android assets.
    // No SQLite migration or runtime network calls are required.
    sourceSets {
        main {
            assets.srcDir '../progress-engine/src/main/resources'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        // Installable next to existing Asterion builds. Never overwrites
        // profiles stored by an APK signed with a different debug key.
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':core')
    implementation project(':progress-engine')
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
