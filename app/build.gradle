plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.asterionsystem.app'
    compileSdk 36

    defaultConfig {
        applicationId 'pe.asterionsystem.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // A single versioned source of exercise taxonomy for JVM tests and Android assets.
    // No SQLite migration or runtime network calls are required.
    sourceSets {
        main {
            assets.srcDir '../progress-engine/src/main/resources'
            // Recursos originales descargados en compilación; la APK sigue offline.
            res.srcDir "$buildDir/generated/monarchArt/res"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        // Installable next to existing Asterion builds. Never overwrites
        // profiles stored by an APK signed with a different debug key.
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':core')
    implementation project(':progress-engine')
    implementation 'androidx.activity:activity:1.11.0'
    // GIF locales por ID; descarga y verificación ocurren durante el build, no en la app.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


tasks.register('prepareExerciseGifAssets', Exec) {
    group = 'build setup'
    description = 'Descarga el paquete de GIF verificado y genera el manifiesto local.'
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_android_exercise_assets.py', '--if-missing'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareExerciseGifAssets')
}

tasks.register('prepareMonarchArt', Exec) {
    group = 'build setup'
    description = 'Prepara ilustraciones canónicas de Beru, Ashborn y Baran como recursos locales.'
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_monarch_art.py',
            '--dest', project.layout.buildDirectory.dir('generated/monarchArt/res/drawable-nodpi').get().asFile.absolutePath
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareMonarchArt')
}
