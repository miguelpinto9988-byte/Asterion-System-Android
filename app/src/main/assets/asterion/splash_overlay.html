<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Asterion System — capa visual offline</title>
<style>
html,body{padding:0;margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;pointer-events:none;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
.stage{position:absolute;inset:0;overflow:hidden;contain:layout paint style;pointer-events:none}
.stage:before{content:"";position:absolute;inset:1.1%;border:1px solid rgba(204,195,255,.24);border-radius:4px;box-shadow:inset 0 0 22px rgba(45,43,139,.1)}
.aura{position:absolute;width:24%;height:36%;top:30%;border-radius:50%;filter:blur(35px);opacity:.45;mix-blend-mode:screen;animation:breath 3s ease-in-out infinite alternate}
.aura.left{left:-15%;background:rgba(111,65,255,.7)}
.aura.right{right:-15%;top:47%;background:rgba(71,169,253,.53);animation-delay:-1.5s}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#e7e4ff;box-shadow:0 0 5px 2px rgba(155,126,253,.8);animation:float 2.9s ease-in-out infinite}
.star:nth-child(1){top:8%;left:18%;animation-delay:-1s}
.star:nth-child(2){top:14%;left:81%;animation-delay:-1.3s}
.star:nth-child(3){top:28%;left:10%;animation-delay:-.8s}
.star:nth-child(4){top:33%;left:86%;animation-delay:-1.9s}
.star:nth-child(5){top:52%;left:7%;animation-delay:-2.4s}
.star:nth-child(6){top:61%;left:90%;animation-delay:-.1s}
.star:nth-child(7){top:74%;left:15%;animation-delay:-1.4s}
.star:nth-child(8){top:82%;left:87%;animation-delay:-2.1s}
.star:nth-child(9){top:94%;left:32%;animation-delay:-.5s}
.star:nth-child(10){top:91%;left:68%;animation-delay:-2.6s}
@keyframes float{0%,100%{opacity:.1;transform:translate3d(0,7px,0) scale(.5)}50%{opacity:.92;transform:translate3d(1px,-8px,0) scale(1.4)}}
@keyframes breath{from{opacity:.17;transform:scale(.89)}to{opacity:.48;transform:scale(1.14)}}
@media(prefers-reduced-motion:reduce){.star,.aura{animation:none}}
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="aura left"></div><div class="aura right"></div>
  <i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i>
  <i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i>
</div>
</body>
</html>
